[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "alembic/versions", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:jose.*",
    "ignore::DeprecationWarning:slowapi.*",
]
